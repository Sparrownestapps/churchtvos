<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141824" />
    <meta name="description" content="Church TV OS: manage the kids-room and signage TVs at your church." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Church TV OS" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="preload" href="/fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Church TV OS</title>
    <script>
      // Apply the saved theme (light / dark / system) before first paint so there is no flash.
      (function () {
        var mode = 'system';
        try { var v = localStorage.getItem('churchtvos.theme'); if (v === 'light' || v === 'dark' || v === 'system') mode = v; } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
